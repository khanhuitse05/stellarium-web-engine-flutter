name: mlastro_skymap
description: Flutter package — interactive sky map powered by Stellarium Web Engine (AGPL-3.0).
repository: https://github.com/khanhuitse05/stellarium-web-engine-flutter
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  geolocator: ^14.1.1
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.3.0
  logger: ^2.8.0
  url_launcher: ^6.3.2
  flutter_rotation_sensor: ^0.4.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/sky_map/index.html
    - assets/sky_map/mlastro_sky.js
    - assets/sky_map/NOTICE
    - assets/sky_map/stellarium/stellarium-web-engine.js
    - assets/sky_map/stellarium/stellarium-web-engine.wasm
    - assets/sky_map/stellarium/skydata.tar.gz
    - assets/sky_map/stellarium/LICENSE-AGPL-3.0.txt
