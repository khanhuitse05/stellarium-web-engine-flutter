<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>MLASTRO Sky Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #stel-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #stel-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #8899aa;
      font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }
    #loading.error {
      color: #ff8888;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="stel-root">
    <canvas id="stel-canvas"></canvas>
    <div id="loading">Loading sky map…</div>
  </div>
  <script src="stellarium/stellarium-web-engine.js"></script>
  <script src="mlastro_sky.js"></script>
</body>
</html>
