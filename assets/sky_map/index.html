<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>MLASTRO Sky Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #stel-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #stel-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transition: filter 0.3s ease;
    }
    #reticle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 2;
    }
    #stel-root.night-mode #stel-canvas {
      filter: sepia(100%) saturate(900%) hue-rotate(315deg) contrast(140%) brightness(0.85);
    }
    #stel-root.night-mode::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 0, 0, 0.12);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 1;
    }
    #loading {
      display: none;
    }
  </style>
</head>
<body>
  <div id="stel-root">
    <canvas id="stel-canvas"></canvas>
    <canvas id="reticle-canvas"></canvas>
    <div id="loading">Loading sky map…</div>
  </div>
  <script src="stellarium/stellarium-web-engine.js"></script>
  <script src="mlastro_sky.js"></script>
</body>
</html>
